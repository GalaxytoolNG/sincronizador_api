nombre: sincronizador_api
titulo: Sincronizador del API
descripcion: Descarga del API público de OGame la configuración, alianzas, jugadores, planetas, puntuaciones y localización de cada universo y los vuelca en las tablas del núcleo.
version: 1.1.0
autor:
