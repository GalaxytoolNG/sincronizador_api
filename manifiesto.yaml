  url: https://github.com/GalaxytoolNG
url: https://github.com/GalaxytoolNG/sincronizador_api
repositorio: https://github.com/GalaxytoolNG/sincronizador_api.git
actualizaciones: https://galaxytoolng.github.io/sincronizador_api/version.json
licencia: GPL-3.0-or-later
clase: Complementos\SincronizadorApi\Complemento
prefijo_rutas: sincronizar
dependencias:
  núcleo: ">=1.1.0"
tablas:
  - nombre: c_sincronizador_api_partes
    descripcion: Último documento importado de cada parte del API por universo (timestamp del XML, momento y registros)
permisos:
  acceso: Sincronizar los universos asociados al usuario
  operador: Sincronizar cualquier universo conocido, también por API con clave
  administrador: Cambiar la configuración del sincronizador
menu:
  - texto: Sincronizador
    ruta: /sincronizar
    nivel: acceso
configuracion:
  tiempo_espera:
    tipo: entero
    defecto: 60
